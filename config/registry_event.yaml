# Configuration for Registry Event type experiments

data:
  benign_train: ~/data/benign/registry_event/benign_train.txt   # 100% benign — dùng cho cả train.py + validate.py (production)
  benign_valid: ~/data/benign/registry_event/benign_train.txt   # = benign_train (production). Đổi sang benign_train_split_val.txt nếu muốn 80/20 holdout
  benign_field: winlog.event_data.TargetObject
  events_dir: ~/data/sigma/events_hayabusa/windows/registry_event
  evasions_dir: ~/data/sigma/evasions/windows/registry_event
  rules_dir: ~/data/sigma/rules/windows/registry
  # Fix v2 (2026-05-20): mở rộng search_fields cover thêm field rule check
  search_fields:
    - TargetObject
    - Details
    - Image
    - User
    - EventType
  event_field_map:
    TargetObject:
      - registry.path                    # Elastic Agent ECS (primary)
      - winlog.event_data.TargetObject   # Winlogbeat / legacy
      - Details.RegKey
    Details:
      - registry.data.strings            # Elastic Agent ECS (list → join, primary)
      - winlog.event_data.Details        # Winlogbeat / legacy
      - Details.Details
    Image:
      - process.executable
      - winlog.event_data.Image
    User:
      - user.name
      - winlog.event_data.User
    EventType:
      - winlog.event_data.EventType
  max_benign_samples: 30000        # cap Stage 1 benign — LMD Sysmon EID 12/13/14 có thể rất lớn
  max_attribution_benign: 15000    # cap Stage 2 per-rule benign

training:
  malicious_samples: both
  vectorization: tfidf
  ngram_range: [1, 1]
  search_params: true
  scoring: f1
  cv_folds: 5
  num_jobs: 3

validation:
  # Registry synthetic evasions may be absent because many registry Sigma patterns
  # still match after simple hive/case transformations. Use Hayabusa match events
  # as the positive validation set unless explicit evasions are generated.
  malicious_samples: matches

scaling:
  mcc_scaling: true
  mcc_threshold: 0.1
  num_mcc_samples: 50

evaluation:
  num_thresholds: 50

output:
  dir: models/registry_event
  result_name: ensemble_f1
  train_result_path: models/registry_event/train_rslt_ensemble_f1.zip
  attr_result_name: attr_ensemble
