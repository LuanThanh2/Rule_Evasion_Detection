# Configuration for PowerShell event type experiments

data:
  benign_train: ~/data/benign/powershell/benign_train.txt
  benign_valid: ~/data/benign/powershell/benign_train.txt
  benign_field: winlog.event_data.ScriptBlockText
  events_dir: ~/data/sigma/events_hayabusa/windows/powershell
  evasions_dir: ~/data/sigma/evasions/windows/powershell
  rules_dir: ~/data/sigma/rules/windows/powershell
  search_fields:
    - winlog.event_data.ScriptBlockText
  malicious_extra: ~/data/benign/powershell/malicious_extra.txt

training:
  malicious_samples: both
  vectorization: tfidf
  ngram_range: [1, 1]
  search_params: true
  scoring: f1
  cv_folds: 5
  num_jobs: 3

scaling:
  mcc_scaling: true
  mcc_threshold: 0.1
  num_mcc_samples: 50

evaluation:
  num_thresholds: 50

output:
  dir: models/powershell
  result_name: misuse_svc_rules_f1
  train_result_path: models/powershell/train_rslt_misuse_svc_rules_f1.zip
  attr_result_name: attr_svc_rules
